server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

storex:
  env: ${APP_ENV:dev}
  logstash:
    destination: ${LOGSTASH_DESTINATION:localhost:5000}

logging:
  level:
    com.storex: DEBUG
